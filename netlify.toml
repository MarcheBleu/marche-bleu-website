# Netlify configuration for the Le Marché Bleu static site.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The market page was removed; send any old links home.
[[redirects]]
  from = "/market/*"
  to = "/"
  status = 301

# Long-cache immutable assets (fonts and Astro's hashed build output).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
